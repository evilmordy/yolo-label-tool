name: Build & Release YOLOTxtMaker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller main.spec

      - name: Verify build output
        run: dir dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/YOLOTxtMaker.exe

  build-linux:
    # AppImageHub 在 ubuntu-22.04（glibc 2.35）上测试。setup-python 会装
    # 「与 runner 系统对应」的 CPython；ubuntu-latest 目前是 24.04，打进去的
    # libpython 需要 GLIBC_2.38，程序在弹出窗口前就退出。不能改成在更新的
    # runner 里套 ubuntu:22.04 容器：选包看的是宿主 runner，不是容器。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # 22.04 没有 libfuse2t64。原先写在同一条 apt 里并用 || 回退时，
          # 找不到这个包会让整次安装失败，Qt/ImageMagick 也不会装上。
          # libqxcb.so 直接链接这些 xcb-util / xkbcommon。只在 runner 上 apt
          # 不够：Hub 的 firejail 里没有它们，必须打进 AppImage。这里安装是为了
          # 让打包脚本能把 SONAME 拷进去，并在 Xvfb 里做启动检查。
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libx11-xcb1 \
            libegl1 \
            imagemagick \
            libfuse2 \
            binutils \
            xvfb \
            x11-utils \
            x11-apps \
            appstream \
            desktop-file-utils

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller main.spec

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/YOLOTxtMaker

      - name: Verify glibc <= 2.35
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from PyInstaller.archive.readers import CArchiveReader

          MAX = (2, 35)
          pat = re.compile(r"GLIBC_(\d+)\.(\d+)")
          binary = Path(sys.argv[1] if len(sys.argv) > 1 else "dist/YOLOTxtMaker")

          def glibc_versions(path: Path):
              out = subprocess.run(
                  ["objdump", "-T", str(path)],
                  check=False,
                  capture_output=True,
                  text=True,
              ).stdout
              return {(int(a), int(b)) for a, b in pat.findall(out)}

          def main():
              if not binary.is_file():
                  sys.exit(f"missing {binary}")
              offenders = []
              worst = (0, 0)
              saw_libpython = False

              def consider(label, versions):
                  nonlocal worst
                  if versions and max(versions) > worst:
                      worst = max(versions)
                  too_new = [v for v in versions if v > MAX]
                  if too_new:
                      offenders.append((label, max(too_new)))

              consider(binary.name, glibc_versions(binary))
              reader = CArchiveReader(str(binary))
              with tempfile.TemporaryDirectory() as tmp:
                  dest = Path(tmp) / "obj"
                  for name, entry in reader.toc.items():
                      if entry[-1] != "b":
                          continue
                      data = reader.extract(name)
                      if not data.startswith(b"\x7fELF"):
                          continue
                      if "libpython" in name:
                          saw_libpython = True
                      dest.write_bytes(data)
                      consider(name, glibc_versions(dest))

              print(f"Highest GLIBC required: {worst[0]}.{worst[1]}")
              if not saw_libpython:
                  sys.exit("libpython was not found in the PyInstaller archive")
              if worst == (0, 0):
                  sys.exit("no GLIBC versions found; objdump scan failed")
              if offenders:
                  print("GLIBC newer than 2.35 (Ubuntu 22.04) found:")
                  for name, ver in offenders:
                      print(f"  GLIBC_{ver[0]}.{ver[1]}  {name}")
                  sys.exit(1)
              print("OK: bundled ELF files need GLIBC <= 2.35")

          if __name__ == "__main__":
              main()
          PY

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          chmod +x dist/YOLOTxtMaker

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/YOLOTxtMaker AppDir/usr/bin/YOLOTxtMaker
          ln -s usr/bin/YOLOTxtMaker AppDir/AppRun
          test -L AppDir/AppRun
          test "$(readlink AppDir/AppRun)" = usr/bin/YOLOTxtMaker

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=YOLOTxtMaker' \
            'GenericName=YOLO label tool' \
            'Comment=Create and edit YOLO annotation files' \
            'Exec=YOLOTxtMaker' \
            'Icon=YOLOTxtMaker' \
            'Categories=Graphics;' \
            'Terminal=false' \
            > AppDir/YOLOTxtMaker.desktop

          cp AppDir/YOLOTxtMaker.desktop AppDir/usr/share/applications/

          # Hub 的 appdir-lint 只认 usr/share/metainfo 里的 *appdata.xml，
          # 不认 *.metainfo.xml。文件名用 .appdata.xml，组件 id 仍是反向域名。
          mkdir -p AppDir/usr/share/metainfo
          cp appimage/com.evilmordy.yolotxtmaker.appdata.xml AppDir/usr/share/metainfo/

          convert -size 256x256 xc:'#0ea5e9' AppDir/YOLOTxtMaker.png
          cp AppDir/YOLOTxtMaker.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp AppDir/YOLOTxtMaker.png AppDir/.DirIcon

          desktop-file-validate AppDir/YOLOTxtMaker.desktop
          appstreamcli validate-tree --no-net AppDir

          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir YOLOTxtMaker.AppImage
          test -f YOLOTxtMaker.AppImage

      - name: Smoke test AppImage
        run: bash appimage/smoke_appimage.sh "$PWD/YOLOTxtMaker.AppImage"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: YOLOTxtMaker.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary PyQt5,PyQt5-Qt5,PyQt5-sip -r requirements.txt
          pyinstaller main.spec

      - name: Verify build output
        run: ls -la dist/

      - name: Package macOS app
        run: |
          ls -la dist/
          test -d dist/YOLOTxtMaker.app || { echo "YOLOTxtMaker.app not found"; exit 1; }
          ditto -c -k --keepParent dist/YOLOTxtMaker.app YOLOTxtMaker-mac.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: YOLOTxtMaker-mac.zip

  release:
    # PR 只验证三平台能打出包，不发 Release。
    if: github.event_name != 'pull_request'
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Using push tag ${GITHUB_REF_NAME}"
            exit 0
          fi
          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [[ -z "${latest}" ]]; then
            major=0; minor=0; patch=0
          else
            ver=${latest#v}
            major=${ver%%.*}
            rest=${ver#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            patch=${patch%%[^0-9]*}
            patch=${patch:-0}
          fi
          while true; do
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
            if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
              continue
            fi
            if gh release view "${next}" >/dev/null 2>&1; then
              continue
            fi
            break
          done
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: ${next} (previous ${latest:-none})"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/YOLOTxtMaker.exe
            artifacts/YOLOTxtMaker.AppImage
            artifacts/YOLOTxtMaker-mac.zip
