name: Build & Release YOLOTxtMaker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller main.spec

      - name: Verify build output
        run: dir dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/YOLOTxtMaker.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libx11-xcb1 \
            libegl1 \
            imagemagick \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller main.spec

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/YOLOTxtMaker

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          chmod +x dist/YOLOTxtMaker

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/YOLOTxtMaker AppDir/usr/bin/YOLOTxtMaker
          ln -s usr/bin/YOLOTxtMaker AppDir/AppRun

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=YOLOTxtMaker' \
            'Exec=YOLOTxtMaker' \
            'Icon=YOLOTxtMaker' \
            'Categories=Graphics;' \
            'Terminal=false' \
            > AppDir/YOLOTxtMaker.desktop

          cp AppDir/YOLOTxtMaker.desktop AppDir/usr/share/applications/

          convert -size 256x256 xc:'#0ea5e9' AppDir/YOLOTxtMaker.png
          cp AppDir/YOLOTxtMaker.png AppDir/usr/share/icons/hicolor/256x256/apps/

          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir YOLOTxtMaker.AppImage
          test -f YOLOTxtMaker.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: YOLOTxtMaker.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary PyQt5,PyQt5-Qt5,PyQt5-sip -r requirements.txt
          pyinstaller main.spec

      - name: Verify build output
        run: ls -la dist/

      - name: Package macOS app
        run: |
          ls -la dist/
          test -d dist/YOLOTxtMaker.app || { echo "YOLOTxtMaker.app not found"; exit 1; }
          ditto -c -k --keepParent dist/YOLOTxtMaker.app YOLOTxtMaker-mac.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: YOLOTxtMaker-mac.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Using push tag ${GITHUB_REF_NAME}"
            exit 0
          fi
          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [[ -z "${latest}" ]]; then
            major=0; minor=0; patch=0
          else
            ver=${latest#v}
            major=${ver%%.*}
            rest=${ver#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            patch=${patch%%[^0-9]*}
            patch=${patch:-0}
          fi
          while true; do
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
            if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
              continue
            fi
            if gh release view "${next}" >/dev/null 2>&1; then
              continue
            fi
            break
          done
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: ${next} (previous ${latest:-none})"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/YOLOTxtMaker.exe
            artifacts/YOLOTxtMaker.AppImage
            artifacts/YOLOTxtMaker-mac.zip
